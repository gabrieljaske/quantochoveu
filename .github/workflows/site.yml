name: Atualizar dados e publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar pasta do site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f CNAME ] && cp CNAME _site/ || true
      - name: Buscar dados de chuva
        env:
          CEMADEN_EMAIL: quantochoveu@gmail.com
          CEMADEN_SENHA: ${{ secrets.CEMADEN_SENHA }}
        run: node scripts/atualizar.mjs _site/dados.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
