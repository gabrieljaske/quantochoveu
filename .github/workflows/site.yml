name: Atualizar dados e publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar pasta do site
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -f municipios.json ] && cp municipios.json _site/ || true
          [ -f CNAME ] && cp CNAME _site/ || true
      - name: Buscar dados de chuva
        env:
          CEMADEN_EMAIL: quantochoveu@gmail.com
          CEMADEN_SENHA: ${{ secrets.CEMADEN_SENHA }}
        run: node scripts/atualizar.mjs _site/dados.json
      - name: Guardar historico de previsoes
        run: |
          if [ -n "$(git status --porcelain historico)" ]; then
            git config user.name "quantochoveu-robo"
            git config user.email "quantochoveu-robo@users.noreply.github.com"
            git add historico
            git commit -m "Historico de previsoes"
            git pull --rebase || true
            git push || echo "nao consegui gravar o historico agora"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Aguardar o artefato ficar disponivel
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
